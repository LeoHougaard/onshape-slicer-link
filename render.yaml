# Draft deployment. Creating this paid service requires the account owner's approval.
services:
  - type: web
    name: onshape-slicer-link
    runtime: python
    plan: starter
    numInstances: 1
    autoDeployTrigger: 'off'
    buildCommand: pip install --require-hashes -r packaging/requirements-server.txt && pip install --no-deps .
    startCommand: python -m uvicorn slicer_link.asgi:app --host 0.0.0.0 --port $PORT --no-access-log --no-proxy-headers
    healthCheckPath: /health
    disk:
      name: slicer-link-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: OSL_DATA_DIR
        value: /var/data
      - key: OSL_ENCRYPTION_KEY
        sync: false
      - key: ONSHAPE_CLIENT_ID
        value: ''
      - key: ONSHAPE_CLIENT_SECRET
        value: ''
