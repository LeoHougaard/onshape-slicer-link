name: Build helper packages
on:
  workflow_dispatch:
    inputs:
      origin:
        description: HTTPS application address; leave blank for a development package
        required: false
permissions:
  contents: read
jobs:
  package:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked build dependencies
        run: |
          python -m pip install uv
          uv sync --locked --extra dev
      - name: Build the helper and include the service address
        env:
          OSL_RELEASE_ORIGIN: ${{ inputs.origin }}
        shell: bash
        run: uv run python scripts/build_helper.py --origin "$OSL_RELEASE_ORIGIN"
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/windows.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: helper-${{ runner.os }}-x86_64
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*Setup*.exe

# Linux packaging is supported; this workflow does not execute Linux tests.
# Artifacts remain drafts. Nothing is published as a release or deployed.
