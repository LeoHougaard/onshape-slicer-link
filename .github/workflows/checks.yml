name: Windows checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked development dependencies
        run: |
          python -m pip install uv
          uv sync --locked --extra server --extra dev --extra browser
          uv run playwright install chromium
      - name: Check the replacement application
        run: |
          uv run ruff check slicer_link tests/stock scripts/build_helper.py scripts/verify_stock_onshape.py
          uv run pytest tests/stock -q

# Linux execution is intentionally absent. Leo waived Linux testing.
