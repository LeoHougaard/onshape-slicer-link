[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "onshape-slicer-link"
version = "0.1.0"
description = "An Onshape app and portable file helper for unmodified slicers"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = ["cryptography>=44,<47", "keyring>=25,<26"]

[project.optional-dependencies]
server = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "pyinstaller>=6.16,<7", "ruff>=0.11,<1"]
browser = ["playwright>=1.55,<2"]
desktop-test = ["pywinauto>=0.6.9,<1; sys_platform == 'win32'", "pillow>=11,<13"]

[project.scripts]
onshape-slicer-link = "slicer_link.helper:main"
onshape-slicer-link-server = "slicer_link.service:main"

[tool.setuptools.packages.find]
include = ["slicer_link*"]

[tool.setuptools.package-data]
slicer_link = ["web/*", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests/stock"]

[tool.ruff]
target-version = "py311"
line-length = 110
